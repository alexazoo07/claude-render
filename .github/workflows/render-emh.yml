# El Mapa Hincha: render en la nube por tramos (hasta 20 máquinas a la vez).
# Proyecto en elmapahincha/. El audio ya mezclado va en elmapahincha/audio/<audio>.
name: render-emh
run-name: emh ${{ inputs.comp }} (${{ inputs.frames }} frames, ${{ inputs.machines }} máquinas)

on:
  workflow_dispatch:
    inputs:
      comp: { description: 'Composición (p. ej. V24)', required: true }
      frames: { description: 'Total de frames', required: true }
      audio: { description: 'Archivo en elmapahincha/audio (p. ej. a24.m4a)', required: true }
      machines: { description: 'Máquinas en paralelo (máx. 20)', default: '20' }
      start: { description: 'Primer frame (para pruebas)', default: '0' }

defaults:
  run: { working-directory: elmapahincha }

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        working-directory: .
        env: { TOTAL: '${{ inputs.frames }}', N: '${{ inputs.machines }}', S0: '${{ inputs.start }}' }
        run: |
          python3 - <<'PY'
          import json, math, os
          s0 = int(os.environ['S0']); total = int(os.environ['TOTAL']); n = max(1, min(20, int(os.environ['N'])))
          size = math.ceil((total - s0) / n)
          inc = [{'i': f'{k:02d}', 's': s, 'e': min(total - 1, s + size - 1)} for k, s in enumerate(range(s0, total, size))]
          open(os.environ['GITHUB_OUTPUT'], 'a').write('matrix=' + json.dumps({'include': inc}) + '\n')
          PY

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: elmapahincha }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: elmapahincha/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx remotion browser ensure
      - run: npx remotion bundle src/index.ts --out-dir build --public-dir public --log=error
      - name: Tramo ${{ matrix.s }}-${{ matrix.e }}
        run: |
          for t in 1 2 3; do
            npx remotion render build "${{ inputs.comp }}" part.mp4 --frames=${{ matrix.s }}-${{ matrix.e }} \
              --crf=16 --x264-preset=slow --scale=1 --muted --concurrency=$(nproc) --timeout=120000 --log=error && exit 0
            echo "intento $t fallido"; rm -f part.mp4
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with: { name: 'part_${{ matrix.i }}', path: elmapahincha/part.mp4, retention-days: 1, compression-level: 0 }

  merge:
    needs: render
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: elmapahincha/audio }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - uses: actions/download-artifact@v4
        with: { pattern: 'part_*', path: elmapahincha/parts }
      - name: Unir tramos + audio
        run: |
          for d in $(ls -d parts/part_* | sort); do echo "file '$PWD/$d/part.mp4'"; done > list.txt
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -i "audio/${{ inputs.audio }}" -map 0:v -map 1:a -c:v copy -c:a copy -shortest -movflags +faststart final.mp4
          ffprobe -v error -count_packets -select_streams v:0 -show_entries stream=width,height,r_frame_rate,nb_read_packets -show_entries format=duration,size -of compact final.mp4
      - uses: actions/upload-artifact@v4
        with: { name: final, path: elmapahincha/final.mp4, retention-days: 3, compression-level: 0 }
      - name: Subir a la rama out-<comp> en trozos de 90 MB (para descargarlo con git)
        run: |
          B="out-${{ inputs.comp }}"
          mkdir -p /tmp/o && cd /tmp/o && git init -q && git checkout -q -b "$B"
          split -b 90M -d -a 3 "$GITHUB_WORKSPACE/elmapahincha/final.mp4" part_
          md5sum "$GITHUB_WORKSPACE/elmapahincha/final.mp4" | cut -d' ' -f1 > md5
          git add . && git -c user.name=render -c user.email=render@users.noreply.github.com commit -q -m "$B"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$B"
