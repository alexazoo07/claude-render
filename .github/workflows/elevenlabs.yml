name: elevenlabs
on:
  workflow_dispatch:
    inputs:
      mode: {description: 'list | tts', required: true, default: 'list'}
      job: {description: 'path of job json (tts mode)', required: false, default: ''}
      tag: {description: 'output folder name', required: true, default: 'voices'}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 elevenlabs/elevenlabs.py ${{ inputs.mode }} ${{ inputs.job }}
      - name: Push result to branch elevenlabs-out
        run: |
          mkdir -p /tmp/res && cp -r out /tmp/res/${{ inputs.tag }}
          git config user.name render-bot && git config user.email render-bot@users.noreply.github.com
          git fetch origin elevenlabs-out || true
          if git rev-parse --verify origin/elevenlabs-out >/dev/null 2>&1; then git checkout -B elevenlabs-out origin/elevenlabs-out; else git checkout --orphan elevenlabs-out && git rm -rf . -q; fi
          rm -rf ${{ inputs.tag }} && cp -r /tmp/res/${{ inputs.tag }} ./${{ inputs.tag }}
          git add ${{ inputs.tag }} && git commit -qm "elevenlabs ${{ inputs.tag }}" && git push -q origin elevenlabs-out
