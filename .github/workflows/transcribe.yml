name: transcribe
on:
  workflow_dispatch:
    inputs:
      dir: {description: 'folder with audio', required: true, default: 'refaudio'}
permissions:
  contents: write
jobs:
  stt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q faster-whisper
      - name: transcribe
        run: |
          mkdir -p /tmp/tr
          python3 - <<'P'
          import glob, json, os
          from faster_whisper import WhisperModel
          m = WhisperModel('medium', device='cpu', compute_type='int8')
          for f in sorted(glob.glob('${{ inputs.dir }}/*.mp3')):
              segs, info = m.transcribe(f, language='es', word_timestamps=True, vad_filter=False)
              out = []
              for s in segs:
                  out.append({'start': s.start, 'end': s.end, 'text': s.text, 'words': [{'w': w.word, 's': w.start, 'e': w.end} for w in (s.words or [])]})
              json.dump(out, open('/tmp/tr/' + os.path.basename(f)[:-4] + '.json', 'w'), ensure_ascii=False, indent=1)
              print(f, len(out))
          P
      - name: push
        run: |
          cd /tmp/tr && git init -q && git checkout -q -b transcripts && git add . && git -c user.name=bot -c user.email=bot@x commit -q -m tr
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" transcripts
